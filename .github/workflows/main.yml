name: Build macOS DMG

on:
  push:
    branches:
      - arq
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: 🐍 Install Python distutils (required for node-gyp)
        run: |
          brew install python@3.11
          python3 -m ensurepip
          python3 -m pip install setuptools

      - name: 📦 Install dependencies
        run: yarn install

      - name: 🔨 Build macOS DMG
        run: npm run macos

      - name: 📤 Upload artifacts (DMG)
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/
