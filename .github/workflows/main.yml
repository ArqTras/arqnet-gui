name: Build macOS DMG

on:
  push:
    branches:
      - arq
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 14

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build macOS DMG
        run: npm run macos

      - name: 📤 Upload artifacts (DMG)
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/
